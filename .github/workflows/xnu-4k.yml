name: xnu-4k

# The 4 KiB chain: upstream UniXNU's build-xnu-4k-baseline.sh against
# apple-oss-distributions/xnu-10063.141.1 (macOS 14.6 / iPadOS 17.7.11),
# which is what both SM8550 ports (fuxi, m2381) run. No ios-sweet patches,
# no __ARM_16K_PG__.
on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: "DEVELOPMENT"
      keep_going:
        description: make -k
        default: "true"

concurrency:
  group: xnu-4k-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  # Bring-up personality: the set fuxi_defconfig would pass, minus the gates
  # that need a signing policy bundle from a real OS/SystemOS DMG.
  XNU_ARM_DT_PLATFORM: "1"
  XNU_ARMCPU: "1"
  XNU_NATIVE_UFS: "1"
  XNU_NATIVE_AES: "1"
  XNU_SOURCE_CORECRYPTO14: "1"
  XNU_SOURCE_PTHREAD: "1"
  XNU_SHENG_PMGR: "1"
  XNU_NATIVE_ARCH_TIMER: "1"
  XNU_NATIVE_PAN: "1"
  XNU_DT_PANIC_REGION: "1"
  XNU_CRYPTO_BOOTSTRAP: "prelinked"
  XNU_TRUST_CACHE_RUNTIME: "0"
  XNU_VERIFIED_ROOT_PROBE: "0"
  XNU_BOOT_PROGRESS: "0"
  XNU_NATIVE_MOBILE_DISPLAY: "0"
  XNU_ARMVIRT_PLATFORM: "0"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          # The driver needs keg-only Homebrew LLVM (archive builders), LLD
          # (payload panic screen), mtools and dtc (boot image / device tree).
          brew install llvm lld mtools dtc

          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          echo '=== available Xcode ==='
          ls -d /Applications/Xcode_*.app
          # xnu-10063 needs a clang that accepts -mach_msg2 (Xcode 16+).
          XC=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_1[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
            echo "::warning::no Xcode 16+; falling back to $XC (-mach_msg2 may be unsupported)"
          fi
          echo "chosen: $XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      # ordering (tree assembly, archive builders, corecrypto, patches, the
      # kernel link) and the header staging that the raw script assumes has
      # already happened. Calling the script directly is what produced the
      # long chain of missing archive / missing header failures.
      # mig shells out to `clang` from PATH to compile .defs files, and Homebrew
      # LLVM does not accept Apple's -mach_msg2, which shows up as
      #   clang: error: unknown argument: '-mach_msg2'
      #   mig: fatal: no SubSystem declaration
      # Keep Homebrew LLVM off PATH: the driver reaches it by absolute path for
      # the archive builders only.
      - name: Pin the Xcode toolchain on PATH
        run: |
          XC=${DEVELOPER_DIR%/Contents/Developer}
          TOOL="$XC/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin"
          echo "$TOOL" >> "$GITHUB_PATH"
          echo '=== clang resolution ==='
          which -a clang | head -5
          clang --version | head -2
          echo '=== mig ==='
          xcrun --sdk iphoneos --find mig
          xcrun --sdk iphoneos --find clang
      - name: Assemble the build tree
        run: |
          set -o pipefail
          # ShengUfs and the other board-selected drivers are not gitmodules
          # entries: the device repository supplies them before the tree is
          # assembled, because the driver copies drivers/ into the tree.
          fetch_driver() { [ -d "$1/.git" ] || git clone --depth 1 "$2" "$1"; }
          fetch_driver drivers/NativeUfs https://github.com/UniXNU/ShengUfs.git
          ls -d drivers/*/ 2>/dev/null | head -20
          export DEVELOPER_DIR=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_1[6-9]*.app 2>/dev/null | sort -V | tail -1)/Contents/Developer
          export PATH="$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin:$PATH"
          chmod +x unixnu scripts/build-xnu-4k-baseline.sh scripts/linux/* 2>/dev/null || true
          # This checkout is both the driver tree and the device repository
          # (board.toml lives at the root), so point -D at it.
          export UNIXNU_DEVICE="$PWD"
          ./unixnu defconfig -D "$PWD" nuwa4k_defconfig
          ./unixnu tree -D "$PWD" 2>&1 | tail -40

      - name: Build kernel
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          # /usr/bin/clang is the Command Line Tools shim and stays at 15.0 no
          # matter what xcode-select says; its mig then passes -mach_msg2 to a
          # clang that does not know the flag. Put the selected Xcode's
          # toolchain in front instead.
          export DEVELOPER_DIR=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_1[6-9]*.app 2>/dev/null | sort -V | tail -1)/Contents/Developer
          export PATH="$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin:$PATH"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          which -a clang | head -4
          clang --version | head -2
          export UNIXNU_DEVICE="$PWD"
          ./unixnu build -D "$PWD" kernel 2>&1 | tee /tmp/kernel.log | tail -120

      - name: Diagnose firehose headers
        if: always()
        run: |
          TREE=out/nuwa/tree
          echo '=== refer/libdispatch/os ==='
          ls -l "$TREE/refer/libdispatch/os/" 2>/dev/null | head -20 || echo 'missing dir'
          echo '=== firehose_buffer_private.h anywhere under refer ==='
          find "$TREE/refer" -name 'firehose_buffer_private.h' 2>/dev/null | head -5 || true
          echo '=== fakeroot include os ==='
          ls -l "$TREE/.cache/fakeroot/usr/local/include/os/" 2>/dev/null | head -15 || echo 'missing dir'
          echo '=== fakeroot include kernel/os ==='
          ls -l "$TREE/.cache/fakeroot/usr/local/include/kernel/os/" 2>/dev/null | head -15 || echo 'missing dir'
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          find build/xnu -name 'kernel.*' -o -name 'mach.*' 2>/dev/null | head -20
          cp build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf out/ 2>/dev/null || true
          cp build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/kernel.development.bcm2837 out/ 2>/dev/null || true
          # The driver keeps full pass logs here; they are the real diagnostic.
          mkdir -p out/driver-logs && cp -R out/nuwa/logs/. out/driver-logs/ 2>/dev/null || true
          ls -la out/driver-logs 2>/dev/null | head -20 || true
          ls -la out
          (cd out && shasum -a 256 * > SHA256SUMS) || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-4k-logs
          path: |
            /tmp/kernel.log
            out/driver-logs
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-4k-kernel
          path: out/
          if-no-files-found: warn
