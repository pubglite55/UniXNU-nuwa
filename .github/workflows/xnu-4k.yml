name: xnu-4k

# The 4 KiB chain: upstream UniXNU's build-xnu-4k-baseline.sh against
# apple-oss-distributions/xnu-10063.141.1 (macOS 14.6 / iPadOS 17.7.11),
# which is what both SM8550 ports (fuxi, m2381) run. No ios-sweet patches,
# no __ARM_16K_PG__.
on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: "DEVELOPMENT"
      keep_going:
        description: make -k
        default: "true"

concurrency:
  group: xnu-4k-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  # Bring-up personality: the set fuxi_defconfig would pass, minus the gates
  # that need a signing policy bundle from a real OS/SystemOS DMG.
  XNU_ARM_DT_PLATFORM: "1"
  XNU_ARMCPU: "1"
  XNU_NATIVE_UFS: "1"
  XNU_NATIVE_AES: "1"
  XNU_SOURCE_CORECRYPTO14: "1"
  XNU_SOURCE_PTHREAD: "1"
  XNU_SHENG_PMGR: "1"
  XNU_NATIVE_ARCH_TIMER: "1"
  XNU_NATIVE_PAN: "1"
  XNU_DT_PANIC_REGION: "1"
  XNU_CRYPTO_BOOTSTRAP: "prelinked"
  XNU_TRUST_CACHE_RUNTIME: "0"
  XNU_VERIFIED_ROOT_PROBE: "0"
  XNU_BOOT_PROGRESS: "0"
  XNU_NATIVE_MOBILE_DISPLAY: "0"
  XNU_ARMVIRT_PLATFORM: "0"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          brew install cmake ninja unifdef
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version


      # build-corecrypto-14.py --namespace needs the XNU symbol list, which
      # xnu_symbols.py reads from the kernel's link.filelist. That file only
      # exists after a kernel link pass, and the link needs the corecrypto
      # archive. Break the cycle the way upstream does: link once without
      # corecrypto, build the provider, then link for real (incremental).
      # The kernel build and the component archives depend on each other:
      # build-arm-driver.py reads the kernel's per-object .cpo.json (compile
      # flags), while the kernel link wants the archives. Upstream resolves it
      # by compiling the kernel first (which writes .cpo.json and
      # link.filelist), then building the archives, then linking again.
      # XNU_ALLOW_MISSING_ARCHIVES skips every test -f assertion so pass 0 can
      # reach the compile stage with nothing built yet.
      - name: Pass 0 - compile kernel to emit .cpo.json and link.filelist
        env:
          XNU_ALLOW_MISSING_ARCHIVES: "1"
        run: |
          set -o pipefail
          bash -x scripts/build-xnu-4k-baseline.sh 2>&1 | tee /tmp/pass0.log | tail -80 || true
          echo '--- artefacts pass 0 must produce ---'
          ls -l build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/link.filelist 2>/dev/null || echo 'link.filelist MISSING'
          ls -l build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT/IOPlatformExpert.cpo.json 2>/dev/null || echo 'cpo.json MISSING'

      - name: Build component archives
        run: |
          set -euo pipefail
          run_archive() { echo "=== $* ==="; python3 "scripts/$1" ${@:2}; }
          run_archive build-arm-driver.py ArmDTPlatform
          run_archive build-arm-driver.py ArmCpu
          run_archive build-arm-driver.py NativeAES
          run_archive prepare-storage-headers.py
          run_archive build-arm-driver.py NativeUfs --unverified
          run_archive build-ufs-original-bindings.py
          run_archive build-sheng-platform-power.py
          run_archive build-libpthread-kernel.py
          run_archive build-legacy-stub.py
          ls -l build/armdt-platform/*.a build/legacy-stub/*.a 2>/dev/null || true

      - name: Build corecrypto provider
        run: |
          set -euo pipefail
          if [ ! -d refer/corecrypto-2023/.git ]; then
            git clone https://github.com/ONLYA/corecrypto-2023.git refer/corecrypto-2023
          fi
          git -C refer/corecrypto-2023 checkout -q 11fba65b12d8830630e248dfa8344caf8b065f26
          python3 scripts/build-corecrypto-14.py
          python3 scripts/build-corecrypto-14.py --namespace
          ls -l build/corecrypto-2023/*.a

      - name: Pass 1 - build the kernel for real
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          bash -x scripts/build-xnu-4k-baseline.sh 2>&1 | tee /tmp/xnu-4k.log | tail -300

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          find build/xnu -name 'kernel.*' -o -name 'mach.*' 2>/dev/null | head -20
          cp build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf out/ 2>/dev/null || true
          cp build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/kernel.development.bcm2837 out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 * > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-4k-kernel
          path: out/
          if-no-files-found: warn
